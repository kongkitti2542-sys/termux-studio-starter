name: Android Debug APK
on:
  push:
    branches: [feature/gate0-android-ui-scaffold, feature/gate1-ide-ui, feature/gate2-local-bridge, feature/functional-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test Termux local bridge
        env:
          TERMUX_STUDIO_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: node --test bridge/server.test.mjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Audit APK signing and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature-report.txt
          "$TOOLS/aapt" dump permissions "$APK" | tee apk-permissions-report.txt
          if grep -Eq "uses-permission: name='android.permission.(READ_SMS|SEND_SMS|READ_CONTACTS|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES)'" apk-permissions-report.txt; then
            echo "Unexpected sensitive permission in Gate 0 APK" >&2
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload APK and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: termux-studio-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-signature-report.txt
            apk-permissions-report.txt
            apk-sha256.txt
          if-no-files-found: error
